name: Control plane checks

on:
  push:
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: npm ci
      - name: Worker build, integration tests and dry deployment
        run: npm run check
      - name: Agent unit tests
        working-directory: agent
        run: go test ./...
