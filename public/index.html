<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>NodeManage</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/subscriptions.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#vps"><span class="mark">NM</span><strong>NodeManage</strong></a>
    <nav aria-label="主导航"><button class="nav-item active" data-view="vps">VPS</button><button class="nav-item" data-view="subscriptions">订阅</button></nav>
    <div class="top-actions"><button id="help" class="icon-button" title="帮助" aria-label="帮助">?</button><button id="refresh" class="icon-button" title="刷新" aria-label="刷新">↻</button><button id="logout" class="secondary small">退出</button></div>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="alerts" aria-live="polite"></div>
    <section id="vps-view" class="view active">
      <div class="page-heading"><div><p class="eyebrow">INFRASTRUCTURE</p><h1>VPS 列表 <span id="vps-count" class="count">0</span></h1><p>管理服务器、协议、配置发布与运行状态。</p></div><button id="create-vps">＋ 创建 VPS</button></div>
      <div class="list-shell"><div class="vps-grid list-head"><span>VPS</span><span>状态</span><span>运行版本</span><span>资源</span><span>操作</span></div><div id="vps-list"></div></div>
    </section>
    <section id="subscriptions-view" class="view">
      <div class="page-heading"><div><p class="eyebrow">DELIVERY</p><h1>订阅列表 <span id="subscription-count" class="count">0</span></h1><p>按需勾选 VPS，创建后自动生成独立订阅链接。</p></div><button id="create-subscription">＋ 创建订阅</button></div>
      <div class="list-shell"><div class="subscription-grid list-head"><span>订阅</span><span>绑定 VPS</span><span>客户端</span><span>状态</span><span>操作</span></div><div id="subscription-list"></div></div>
    </section>
  </main>
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-head"><div><p id="drawer-kicker" class="eyebrow"></p><h2 id="drawer-title"></h2></div><button id="close-drawer" class="icon-button" aria-label="关闭">×</button></div><div id="drawer-content" class="drawer-content"></div></aside>
  <dialog id="result-dialog"><div class="dialog-head"><h2 id="result-title">结果</h2><button id="close-result" class="icon-button">×</button></div><div id="result-content"></div></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
